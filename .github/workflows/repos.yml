# 定期把 GitHub 仓库数据抓成静态文件，供主页作品区读取。
#
# 为什么不在页面里直接调 api.github.com：
#   · 国内访问 GitHub API 长期不稳定
#   · 有未认证频率限制（每小时 60 次 / 每 IP）
#   · 会把"首屏依赖外部网络"这个故障模式请回来
# 预生成之后，页面加载的是本地文件：秒开、无限制、GitHub 挂了也能显示。
#
# 想调整展示哪些仓库：改下面的 FEATURED 数组即可。

name: Update repository data

on:
  schedule:
    # 每周一 03:17 UTC（刻意避开整点，见 GitHub Actions 调度高峰）
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch repositories and write assets/js/repos.data.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: Ohto-Ai
          # 展示顺序即此顺序
          FEATURED: >-
            PostLive
            LightPaper
            NonogramGenerator
            picbed
            webhook
            client-tools
            OpShop
            auto-craft
            MobEditor
            illegal-scanner
            SkullShop
            no-hide-flags
          # 卡片上的标签直接取各仓库在 GitHub 上的 topics，不在这里手工维护。
          # 想改标签就去 GitHub 仓库页面右上角改，下次跑本 workflow 自动同步。
          # 注意：仓库没设 topics 的话就没有标签（目前 illegal-scanner 和
          # SkullShop 是空的）。
          #
          # 主页是全英文的，但这几个仓库在 GitHub 上的描述是中文。
          # 在这里覆盖掉，格式 "仓库名=英文描述"（每行一条）。
          # 不这么做的话，每次 Action 跑完都会把中文描述又拉回来。
          # 注意：这里必须是块标量而不是裸的 "DESC_OVERRIDES:"。
          # 后者在 YAML 里是 null，Actions 的 env 只接受字符串，会直接报错。
          DESC_OVERRIDES: |
            PostLive=Client for a study live-streaming platform — a student research project
            LightPaper=A lightweight dynamic desktop (live wallpaper) engine in C++
            NonogramGenerator=Nonogram generator — logic puzzles that paint a bitmap
        run: |
          set -euo pipefail

          # 拉取全部公开仓库（排除 fork），分页取完
          : > /tmp/all.json
          page=1
          while :; do
            chunk=$(gh api "users/${LOGIN}/repos?per_page=100&page=${page}&type=owner" \
              --jq '[.[] | select(.fork == false)]')
            count=$(printf '%s' "$chunk" | jq 'length')
            [ "$count" -eq 0 ] && break
            printf '%s' "$chunk" >> /tmp/all.json
            page=$((page + 1))
            [ "$page" -gt 10 ] && break
          done

          # 把所有分片合成一个数组
          jq -s 'add' /tmp/all.json > /tmp/repos.json
          total=$(jq 'length' /tmp/repos.json)

          # 按 FEATURED 顺序取出对应仓库
          printf '%s\n' $FEATURED | jq -R . | jq -s . > /tmp/featured.json

          # DESC_OVERRIDES 转成 { "仓库名": "英文描述" }。
          # 描述里可能自带 "="，所以按第一个 = 切分，其余部分拼回去。
          printf '%s\n' "$DESC_OVERRIDES" \
            | jq -R -s 'split("\n")
                | map(select(test("=")))
                | map(split("=") | {(.[0]): (.[1:] | join("="))})
                | add // {}' > /tmp/overrides.json

          # 截图：在 assets/work/ 下找 <仓库名>.<扩展名>。
          # 只要把图按仓库名命名丢进那个目录，下次跑 Action 就会自动接上，
          # 不需要改这个 workflow。找不到就留空，页面会渲染占位块。
          shots='{}'
          for name in $(printf '%s\n' $FEATURED); do
            for ext in webp jpg png gif; do
              if [ -f "assets/work/${name}.${ext}" ]; then
                shots=$(printf '%s' "$shots" \
                  | jq --arg n "$name" --arg p "assets/work/${name}.${ext}" '. + {($n): $p}')
                break
              fi
            done
          done
          printf '%s' "$shots" > /tmp/shots.json

          jq -n \
            --slurpfile repos /tmp/repos.json \
            --slurpfile want /tmp/featured.json \
            --slurpfile over /tmp/overrides.json \
            --slurpfile shots /tmp/shots.json \
            --arg login "$LOGIN" \
            --arg date "$(date -u +%Y-%m-%d)" \
            --argjson total "$total" \
            '{
              generated: $date,
              login: $login,
              total: $total,
              featured: (
                $want[0] as $names
                | [ $names[] as $n
                    | ($repos[0][] | select(.name == $n)) as $r
                    | {
                        name: $r.name,
                        desc: ($over[0][$r.name] // $r.description // ""),
                        lang: ($r.language // ""),
                        stars: $r.stargazers_count,
                        year: ($r.pushed_at | split("-")[0] | tonumber),
                        # 标签直接用仓库自己设的 topics。
                        # 滤掉和语言完全同名的那一个（CMake 仓库挂 "cmake"、
                        # Java 仓库挂 "java"），否则卡片上和底部的语言重复。
                        # C++ 的情况单独处理一下："cpp" / "c" 也一并滤掉。
                        topics: (
                          ($r.language // "" | ascii_downcase) as $l
                          | [ ($r.topics // [])[]
                              | select(. != $l)
                              | select((($l == "c++") and (. == "cpp" or . == "c")) | not)
                            ]
                        ),
                        shot: ($shots[0][$r.name] // "")
                      }
                  ]
              )
            }' > /tmp/body.json

          {
            echo "/*"
            echo " * repos.data.js — 作品区数据"
            echo " *"
            echo " * 本文件由 .github/workflows/repos.yml 自动生成，请勿手工编辑。"
            echo " * 页面把它当普通本地脚本加载，不在运行时调 GitHub API。"
            echo " *"
            echo " * @generated $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo " */"
            printf 'window.OhtoRepos = '
            cat /tmp/body.json
            echo ";"
          } > assets/js/repos.data.js

          echo "已生成：$(jq '.featured | length' /tmp/body.json) 个精选 / 共 ${total} 个仓库"

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/js/repos.data.js; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/repos.data.js
          git commit -m "chore: 更新仓库数据"
          git push
