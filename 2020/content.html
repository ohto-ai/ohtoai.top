<script>
    var sound = document.getElementById('sound');
    var ifShowSocial = true;
    var socialTable = document.getElementById("socialTable");
    var showSocialBn = document.getElementById("showSocialBn");
    function changeSocialShow() {
        socialTable.style.visibility = ifShowSocial ? 'visible' : 'hidden';
        ifShowSocial = !ifShowSocial;
    }

    window.onload = function () {
        changeSocialShow();
        sound.volume = 0.5;
    };

    // The two large preview GIFs are only visible on hover. Load them then,
    // instead of during the initial page load.
    (function () {
        function loadPreview(piece) {
            var img = piece.querySelector("img[data-src]");
            if (!img) return;
            img.src = img.getAttribute("data-src");
            img.removeAttribute("data-src");
        }
        var pieces = document.querySelectorAll(".future_ui__piece");
        for (var i = 0; i < pieces.length; i++) {
            (function (piece) {
                piece.addEventListener("mouseenter", function () {
                    loadPreview(piece);
                }, { once: true });
            })(pieces[i]);
        }
    })();
</script>
